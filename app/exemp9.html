<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor da Placa SECID</title>
  <base href="../" />
  <style>
    @font-face {
      font-family: 'MontserratLight';
      src: url('Montserrat-Light.ttf') format('truetype');
    }

    @font-face {
      font-family: 'GothamLight';
      src: url('Gotham-Light.otf') format('opentype');
    }

    body {
      margin: 0;
      font-family: 'MontserratLight', Arial, sans-serif;
      background: linear-gradient(160deg, #d6d9de 0%, #c2c6cd 100%);
      color: #102640;
    }

    .page {
      max-width: 1900px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-panel,
    .actions-panel {
      background: #f8fbff;
      border: 2px solid #d5e4f3;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(16, 38, 64, 0.15);
      padding: 20px;
    }

    .form-panel h1,
    .actions-panel h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #0f3b69;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #edf5ff;
      border: 1px solid #cfe0f2;
      border-radius: 12px;
      padding: 10px;
    }

    .field label {
      font-weight: 700;
      font-size: 13px;
      color: #124879;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .field input,
    .field select {
      height: 38px;
      border-radius: 8px;
      border: 1px solid #9fc0e1;
      padding: 0 10px;
      font-size: 14px;
      color: #0c2b4a;
      background: #fff;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid #70aee8;
      border-color: #70aee8;
    }

    .checkbox-group {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 8px;
      color: #124879;
      font-weight: 700;
    }

    .actions-row {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      border: none;
      background: #124879;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #0f3b69;
    }

    .secondary {
      background: #7389a5;
    }

    #previewView { display: none; }

    .plate-wrap {
      position: relative;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      border-radius: 18px;
      overflow: hidden;
      background: #c8c8c8;
      width: 1850px;
      max-width: 100%;
    }

    .container {
      margin-top: 0;
      text-align: center;
      padding-top: 30px;
    }

    #img01,
    #img02,
    #img03 {
      border-radius: 20px;
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
    }

    .title-input {
      text-align: center;
      font-size: 70px;
      color: #1c3b61;
      font-family: 'GothamLight', sans-serif;
      border: none;
      background-color: transparent;
      width: 100%;
      outline: none;
      margin-bottom: 26px;
      display: block;
      text-transform: uppercase;
    }

    footer {
      height: 110px;
      background-color: #fff;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    #img04,
    #imgBID,
    #imgFUNDEPAR,
    #infoBox1,
    #infoBox2 {
      position: absolute;
    }

    #imgBID,
    #imgFUNDEPAR {
      height: 90px;
      width: 130px;
      bottom: 14px;
      display: none;
      object-fit: contain;
    }

    #imgBID { left: 35px; }
    #imgFUNDEPAR { left: 172px; }

    #img04 {
      height: 90px;
      width: 220px;
      left: 390px;
      bottom: 16px;
      object-fit: contain;
    }

    #img05 {
      width: 100px;
      height: 90px;
      position: absolute;
      left: 594px;
      bottom: 18px;
      object-fit: contain;
    }

    #img06 {
      height: 90px;
      width: 220px;
      position: absolute;
      right: 20px;
      bottom: 18px;
      object-fit: contain;
    }

    #imgbar {
      position: absolute;
      right: 1170px;
      bottom: 5px;
      height: 120px;
    }

    #infoBox1,
    #infoBox2 {
      left: 50px;
      background-color: #fff;
      border: 1px solid #1c3b61;
      margin-top: 15px;
      height: 70px;
      width: 410px;
      text-align: left;
      padding: 0;
    }

    #infoBox1 { left: 780px; }
    #infoBox2 { width: 430px; left: 1220px; }

    strong {
      font-size: 12px;
      color: #001e6f;
      font-weight: normal;
      text-align: left;
      display: block;
      margin-bottom: 5px;
      font-family: 'MontserratLight', sans-serif;
    }

    .line-value {
      position: absolute;
      color: #001e6f;
      font-family: 'MontserratLight', sans-serif;
      font-size: 17px;
      text-transform: uppercase;
    }

    #p1 { left: 120px; top: 0; }
    #p2 { left: 140px; top: 20px; }
    #p3 { left: 150px; top: 40px; }
    #p31 { left: 102px; top: 0; }
    #p32 { left: 84px; top: 20px; }
    #p33 { left: 83px; top: 40px; }

    @media print {
      body { background: #fff; }
      .actions-panel, #formView { display: none !important; }
      .page { padding: 0; }
      .plate-wrap { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section id="formView" class="form-panel">
      <h1>Formulário da Placa SECID</h1>
      <form id="plateForm">
        <div class="form-grid">
          <div class="field"><label for="obraTitulo">Título da obra</label><input id="obraTitulo" value="CONSTRUÇÃO DA DELEGACIA CIDADÃ IIIA" /></div>
          <div class="field"><label for="valorObra">Valor da obra</label><input id="valorObra" placeholder="R$ 0,00" /></div>
          <div class="field"><label for="fonteRecurso">Fonte de recurso</label><input id="fonteRecurso" /></div>
          <div class="field"><label for="prazoExecucao">Prazo de execução</label><input id="prazoExecucao" /></div>

          <div class="field"><label for="localizacao">Localização</label><input id="localizacao" /></div>
          <div class="field"><label for="dimensao">Dimensão</label><input id="dimensao" /></div>
          <div class="field"><label for="execucao">Execução</label><input id="execucao" /></div>
          <div class="field"><label for="odsSelect">ODS</label><select id="odsSelect"></select></div>

          <div class="field"><label for="logoDropdown1">Logo institucional esquerda</label><select id="logoDropdown1"></select></div>
          <div class="field"><label for="logoDropdown2">Logo institucional direita</label><select id="logoDropdown2"></select></div>
        </div>
        <div class="checkbox-group">
          <label><input type="checkbox" id="bidCheckbox" /> Exibir logo BID</label>
          <label><input type="checkbox" id="fundeparCheckbox" /> Exibir logo FUNDEPAR</label>
        </div>
        <div class="actions-row">
          <button type="submit">Gerar placa</button>
        </div>
      </form>
    </section>

    <section id="previewView">
      <section class="actions-panel">
        <h1>Pré-visualização da placa</h1>
        <div class="actions-row" style="justify-content:flex-start;">
          <button id="backButton" class="secondary" type="button">Voltar para editar</button>
          <button id="exportPdfButton" type="button">Exportar para PDF</button>
        </div>
      </section>

      <section class="plate-wrap">
        <div class="container">
          <img id="img01" style="margin-bottom:40px;" src="gimg5.PNG" alt="PARANÁ EM OBRAS" />
          <img id="img02" style="margin-bottom:20px;" src="ghimg45.PNG" alt="GOVERNO DO ESTADO" />
        </div>

        <span class="title-input" id="tituloPlaca">CONSTRUÇÃO DA DELEGACIA CIDADÃ IIIA</span>

        <footer>
          <img id="img04" alt="Logo institucional esquerda" src="Capturar77.JPG" />
          <img id="imgBID" src="BID.JPG" alt="Logo BID" />
          <img id="imgFUNDEPAR" src="logofundepar.PNG" alt="Logo FUNDEPAR" />
          <img id="img05" src="SDG-16.svg" alt="ODS" />
          <img id="img06" src="Capturar77.JPG" alt="Logo institucional direita" />
          <img id="imgbar" src="bar.JPG" alt="Separador" />

          <div id="infoBox1">
            <strong style="position:absolute;left:10px;top:10px;">VALOR DA OBRA:</strong><span id="p1" class="line-value"></span>
            <strong style="position:absolute;left:10px;top:30px;">FONTE DE RECURSO:</strong><span id="p2" class="line-value"></span>
            <strong style="position:absolute;left:10px;top:50px;">PRAZO DE EXECUÇÃO:</strong><span id="p3" class="line-value"></span>
          </div>
          <div id="infoBox2">
            <strong style="position:absolute;left:10px;top:10px;">LOCALIZAÇÃO:</strong><span id="p31" class="line-value"></span>
            <strong style="position:absolute;left:10px;top:30px;">DIMENSÃO:</strong><span id="p32" class="line-value"></span>
            <strong style="position:absolute;left:10px;top:50px;">EXECUÇÃO:</strong><span id="p33" class="line-value"></span>
          </div>
        </footer>
      </section>
    </section>
  </div>

  <script>
    const odsOptions = [
      { label: 'ODS 1', file: 'SDG-16.svg' },
      { label: 'ODS 2', file: 'SDG-2.svg' },
      { label: 'ODS 3', file: 'SDG-1.svg' },
      { label: 'ODS 4', file: 'SDG-4.svg' },
      { label: 'ODS 5', file: 'SDG-3.svg' },
      { label: 'ODS 6', file: 'SDG-5.svg' },
      { label: 'ODS 7', file: 'SDG-7.svg' },
      { label: 'ODS 8', file: 'SDG-8.svg' },
      { label: 'ODS 9', file: 'SDG-9.svg' },
      { label: 'ODS 10', file: 'SDG-10.svg' },
      { label: 'ODS 11', file: 'SDG-11.svg' },
      { label: 'ODS 12', file: 'SDG-12.svg' },
      { label: 'ODS 13', file: 'SDG-13.svg' },
      { label: 'ODS 14', file: 'SDG-14.svg' },
      { label: 'ODS 15', file: 'SDG-15.svg' },
      { label: 'ODS 16', file: 'SDG-17.svg' },
      { label: 'ODS PNG', file: 'SDG-1.PNG' }
    ];

    const logoOptions = [
      { label: 'Logo 1 - Capturar77', file: 'Capturar77.JPG' },
      { label: 'Logo 2 - SESP', file: 'SESP.JPG' },
      { label: 'Logo 3 - SECOM', file: 'SECOM.png' },
      { label: 'Logo 4 - SEAP', file: 'SEAP.png' },
      { label: 'Logo 5 - SEIMT', file: 'SEIMT.png' },
      { label: 'Logo 6 - SECID', file: 'SECID.PNG' },
      { label: 'Logo 7 - SECADM', file: 'secadm.PNG' },
      { label: 'Logo 8 - SECAGAB', file: 'secagab.PNG' },
      { label: 'Logo 9 - SECCOM', file: 'seccom.PNG' },
      { label: 'Logo 10 - SECCTE', file: 'seccte.PNG' },
      { label: 'Logo 11 - SECCUL', file: 'seccul.PNG' },
      { label: 'Logo 12 - SECEDU', file: 'secedu.PNG' },
      { label: 'Logo 13 - SECFEZ', file: 'secfez.PNG' },
      { label: 'Logo 14 - SECICS', file: 'secics.PNG' },
      { label: 'Logo 15 - SECIDO', file: 'secido.PNG' },
      { label: 'Logo 16 - SECINF', file: 'secinf.PNG' },
      { label: 'Logo 17 - SECINV', file: 'secinv.PNG' },
      { label: 'Logo 18 - SECJUSCID', file: 'secjuscid.PNG' },
      { label: 'Logo 19 - EDUQ', file: 'EDUQ-1.PNG' },
      { label: 'Logo 20 - LOGOFUNDEPAR1', file: 'LOGOFUNDEPAR1.PNG' }
    ];

    const formView = document.getElementById('formView');
    const previewView = document.getElementById('previewView');
    const plateForm = document.getElementById('plateForm');

    function fillSelect(id, options) {
      const select = document.getElementById(id);
      select.innerHTML = '';
      options.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = item.file;
        option.textContent = item.label;
        if (index === 0) option.selected = true;
        select.appendChild(option);
      });
    }

    function updatePlate() {
      document.getElementById('tituloPlaca').textContent = document.getElementById('obraTitulo').value || '';
      document.getElementById('p1').textContent = document.getElementById('valorObra').value || '';
      document.getElementById('p2').textContent = document.getElementById('fonteRecurso').value || '';
      document.getElementById('p3').textContent = document.getElementById('prazoExecucao').value || '';
      document.getElementById('p31').textContent = document.getElementById('localizacao').value || '';
      document.getElementById('p32').textContent = document.getElementById('dimensao').value || '';
      document.getElementById('p33').textContent = document.getElementById('execucao').value || '';

      document.getElementById('img05').src = document.getElementById('odsSelect').value || 'SDG-16.svg';
      document.getElementById('img04').src = document.getElementById('logoDropdown1').value || 'Capturar77.JPG';
      document.getElementById('img06').src = document.getElementById('logoDropdown2').value || 'Capturar77.JPG';
      document.getElementById('imgBID').style.display = document.getElementById('bidCheckbox').checked ? 'block' : 'none';
      document.getElementById('imgFUNDEPAR').style.display = document.getElementById('fundeparCheckbox').checked ? 'block' : 'none';
    }

    fillSelect('odsSelect', odsOptions);
    fillSelect('logoDropdown1', logoOptions);
    fillSelect('logoDropdown2', logoOptions);

    plateForm.addEventListener('submit', (event) => {
      event.preventDefault();
      updatePlate();
      formView.style.display = 'none';
      previewView.style.display = 'block';
    });

    ['obraTitulo','valorObra','fonteRecurso','prazoExecucao','localizacao','dimensao','execucao','odsSelect','logoDropdown1','logoDropdown2','bidCheckbox','fundeparCheckbox']
      .forEach((id) => {
        document.getElementById(id).addEventListener('input', updatePlate);
        document.getElementById(id).addEventListener('change', updatePlate);
      });

    document.getElementById('backButton').addEventListener('click', () => {
      previewView.style.display = 'none';
      formView.style.display = 'block';
    });

    document.getElementById('exportPdfButton').addEventListener('click', () => {
      window.print();
    });

    updatePlate();
  </script>
</body>
</html>
